services:
    vector-db:
        image: dhi.io/pgvector:pg18
        container_name: rag-financebench-vector-db
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-rag_user}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
            POSTGRES_DB: ${POSTGRES_DB:-rag_financebench_vector_db}
        volumes:
            - pgvector-data:/var/lib/postgresql
        networks: 
            - rag-financebench-network
        ports:
            - "127.0.0.1:5432:5432"

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_user} -d ${POSTGRES_DB:-rag_financebench_vector_db}"]
            interval: 10s
            timeout: 5s
            retries: 5

#    backend:


volumes:
    pgvector-data:

networks:
    rag-financebench-network:
        driver: bridge

